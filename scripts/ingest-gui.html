<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>入库</title>
<style>
  :root {
    --bg: #100f0d;
    --panel: #191814;
    --raised: #201e19;
    --line: #2e2b25;
    --line-soft: #26241f;
    --ink: #e8e2d5;
    --ink-dim: #9c9484;
    --ink-faint: #6f695e;
    --gold: #c4a46b;
    --gold-dim: #8a734a;
    --green: #7fa87a;
    --red: #c46b70;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.65 -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 30%, var(--gold) 50%, var(--gold-dim) 70%, transparent);
    z-index: 10;
  }
  header {
    padding: 26px 34px 20px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
  }
  header h1 {
    margin: 0; font: 400 21px/1.3 Georgia, "Songti SC", "Noto Serif CJK SC", serif;
    letter-spacing: .16em; color: var(--ink);
  }
  header .sub { color: var(--ink-faint); font-size: 11px; letter-spacing: .1em; }
  .layout {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
    gap: 26px; padding: 26px 34px 60px; max-width: 1560px; margin: 0 auto;
  }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  .col-right { position: sticky; top: 26px; align-self: start; }

  section { margin-bottom: 26px; }
  section > h2 {
    margin: 0 0 14px; font: 400 12px/1.4 Georgia, "Songti SC", serif;
    letter-spacing: .22em; color: var(--gold); text-transform: uppercase;
    display: flex; align-items: center; gap: 12px;
  }
  section > h2::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .grid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 11px; color: var(--ink-dim); margin-bottom: 6px; letter-spacing: .05em; }
  input, textarea, select {
    width: 100%; background: transparent; color: var(--ink);
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    padding: 7px 2px; font: inherit; outline: none; transition: border-color .2s;
  }
  input:focus, textarea:focus, select:focus { border-bottom-color: var(--gold); }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }
  select { appearance: none; cursor: pointer; }
  select option { background: var(--panel); color: var(--ink); }
  textarea { resize: vertical; min-height: 62px; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; line-height: 1.6; }
  textarea.tall { min-height: 116px; }
  input[type="date"] { color-scheme: dark; }
  input[type="checkbox"] { width: auto; accent-color: var(--gold); }

  .drop {
    border: 1px dashed var(--line); padding: 22px; text-align: center;
    color: var(--ink-dim); cursor: pointer; background: var(--panel);
    transition: border-color .2s; font-size: 12px; letter-spacing: .1em;
  }
  .drop:hover, .drop.drag { border-color: var(--gold); color: var(--gold); }
  .drop img { display: block; max-width: 100%; max-height: 250px; margin: 0 auto; object-fit: contain; }
  .drop input { display: none; }

  .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ratings label {
    margin: 0; padding: 7px 2px; text-align: center; border: 1px solid var(--line);
    background: transparent; cursor: pointer; color: var(--ink-dim); font-size: 11px; letter-spacing: .03em;
    transition: all .2s;
  }
  .ratings label:hover { border-color: var(--gold-dim); color: var(--ink); }
  .ratings input { display: none; }
  .ratings label.on-general { border-color: var(--gold); color: var(--gold); background: rgba(196,164,107,.07); }
  .ratings label.on-sensitive { border-color: #a97c48; color: #d3a66e; background: rgba(169,124,72,.07); }
  .ratings label.on-nsfw { border-color: var(--red); color: var(--red); background: rgba(196,107,112,.07); }
  .ratings label.on-r18g { border-color: #9c4a52; color: #c47a80; background: rgba(156,74,82,.09); }

  .actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  button {
    border: 1px solid var(--gold); background: transparent; color: var(--gold);
    padding: 9px 22px; font: inherit; font-size: 12px; letter-spacing: .12em;
    cursor: pointer; transition: all .2s;
  }
  button:hover { background: var(--gold); color: var(--bg); }
  button.ghost { border-color: var(--line); color: var(--ink-dim); }
  button.ghost:hover { border-color: var(--ink-dim); color: var(--ink); background: transparent; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .overwrite { display: flex; align-items: center; gap: 6px; color: var(--ink-faint); font-size: 11px; margin-left: auto; cursor: pointer; }
  #extractBtn { border-color: var(--gold-dim); color: var(--gold); }
  #extractBtn:hover { border-color: var(--gold); }
  .divider { height: 1px; background: var(--line); margin: 34px 0 30px; }
  .divider span { display: block; text-align: center; color: var(--ink-faint); font-size: 10px; letter-spacing: .3em; background: var(--bg); padding: 0 14px; position: relative; top: -8px; width: max-content; margin: 0 auto; }
  details.preview-panel summary { cursor: pointer; list-style: none; color: var(--gold); font: 400 12px/1.4 Georgia, "Songti SC", serif; letter-spacing: .22em; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); margin-bottom: 14px; }
  details.preview-panel summary::-webkit-details-marker { display: none; }
  details.preview-panel summary::before { content: '− '; color: var(--gold-dim); }
  details.preview-panel:not([open]) summary::before { content: '+ '; }

  .preview {
    background: var(--panel); border: 1px solid var(--line-soft); padding: 18px 20px;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11.5px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word; color: #b9b2a3;
    max-height: calc(100vh - 200px); min-height: 300px; overflow: auto;
  }
  .status { margin-top: 12px; font-size: 11px; letter-spacing: .04em; display: none; padding-left: 2px; }
  .status.ok { display: block; color: var(--green); }
  .status.err { display: block; color: var(--red); }

  details.hist summary {
    cursor: pointer; list-style: none; color: var(--gold); font-size: 11px;
    letter-spacing: .2em; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
  }
  details.hist summary::-webkit-details-marker { display: none; }
  details.hist summary::before { content: '＋ '; color: var(--gold-dim); }
  details.hist[open] summary::before { content: '－ '; }
  details.hist[open] summary { margin-bottom: 16px; }
  .tabs { display: flex; gap: 18px; margin-bottom: 12px; }
  .tabs button { flex: none; border: 0; border-bottom: 1px solid transparent; padding: 4px 0; color: var(--ink-faint); background: transparent; font-size: 11px; letter-spacing: .1em; }
  .tabs button:hover { color: var(--ink); background: transparent; }
  .tabs button.active { color: var(--gold); border-bottom-color: var(--gold); }
  .hist-bar { display: flex; gap: 10px; margin-bottom: 12px; }
  .hist-bar input { font-size: 11px; }
  .hist-bar button { padding: 4px 10px; font-size: 11px; }
  .hist-list { max-height: 330px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .hist-item { background: var(--panel); border: 1px solid var(--line-soft); cursor: pointer; overflow: hidden; transition: border-color .2s; }
  .hist-item:hover { border-color: var(--gold); }
  .hist-item img { width: 100%; height: 160px; object-fit: cover; display: block; background: #0b0a09; }
  .hist-item .m { padding: 6px 8px; font-size: 10px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-empty { color: var(--ink-faint); font-size: 11px; padding: 22px; text-align: center; grid-column: 1/-1; }
</style>
</head>
<body>
<header>
  <h1>入 库</h1>
  <div class="sub">本地 · 不发布</div>
</header>

<div class="layout">
  <div>
    <details class="hist" id="histPanel">
      <summary>历史记录</summary>
      <div class="tabs">
        <button id="tabComfy" class="active">ComfyUI</button>
        <button id="tabWorks">已入库</button>
      </div>
      <div class="hist-bar">
        <input id="histSearch" placeholder="搜索" />
        <button id="histRefresh" class="ghost">刷新</button>
      </div>
      <div class="hist-list" id="histList"><div class="hist-empty">载入中</div></div>
      <div class="status" id="histHint"></div>
    </details>

    <section style="margin-top:28px">
      <h2>图片</h2>
      <div class="drop" id="drop">
        <div id="dropText">拖放或点击选择</div>
        <img id="thumb" style="display:none" />
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp" />
      </div>
    </section>

    <section>
      <h2>生成参数</h2>
      <div class="grid">
        <div class="field full"><label>正向</label>
          <textarea id="positive" class="tall" placeholder="masterpiece, best quality, ..."></textarea></div>
        <div class="field full"><label>负向</label>
          <textarea id="negative"></textarea></div>
        <div class="field"><label>画师/画师串</label><input id="pArtist" placeholder="@askzy" /></div>
        <div class="field"><label>角色</label><input id="pCharacter" placeholder="hatsune miku" /></div>
        <div class="field"><label>模型</label><input id="pModel" value="Anima Aesthetic v1.1 + Turbo LoRA" /></div>
        <div class="field"><label>画师</label><input id="artists" placeholder="askzy, ciloranko" /></div>
      </div>
    </section>

    <div class="divider"><span>人工填写</span></div>

    <section>
      <h2>作品信息</h2>
      <div class="grid">
        <div class="field full"><label>场景</label>
          <input id="pScene" placeholder="西湖石桥油纸伞清晨" /></div>
        <div class="field full"><label>标题</label>
          <input id="title" placeholder="西湖石桥油纸伞清晨 · hatsune miku" /></div>
        <div class="field"><label>标识</label>
          <input id="slug" placeholder="gen50-g31" /></div>
        <div class="field"><label>分级</label>
          <div class="ratings">
            <label id="lb-general" class="on-general"><input type="radio" name="rating" value="general" checked />general</label>
            <label id="lb-sensitive"><input type="radio" name="rating" value="sensitive" />sensitive</label>
            <label id="lb-nsfw"><input type="radio" name="rating" value="nsfw" />nsfw</label>
            <label id="lb-r18g"><input type="radio" name="rating" value="r18g" />r18g</label>
          </div>
        </div>
        <div class="field full"><label>摘要</label>
          <input id="summary" placeholder="留空自动生成" /></div>
        <div class="field"><label>标签</label>
          <input id="tags" placeholder="Anima, 精细, 场景" /></div>
        <div class="field"><label>日期</label>
          <input type="date" id="createdAt" /></div>
        <div class="field"><label>层级</label>
          <select id="tier"><option value="refined">refined</option><option value="sketch">sketch</option><option value="showcase">showcase</option></select></div>
      </div>
    </section>

    <div class="actions">
      <button id="extractBtn">补全</button>
      <button id="submit">写入</button>
      <button id="previewBtn" class="ghost">预览</button>
      <button id="resetBtn" class="ghost">清空</button>
      <label class="overwrite"><input type="checkbox" id="overwrite" /> 覆盖</label>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="col-right">
    <details class="preview-panel" open>
      <summary>预览</summary>
      <div class="preview" id="preview"></div>
    </details>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let imageData = null;

function currentFields() {
  const rating = document.querySelector('input[name="rating"]:checked').value;
  return {
    title: $('title').value.trim(),
    slug: $('slug').value.trim(),
    rating,
    summary: $('summary').value.trim(),
    tags: $('tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    artists: $('artists').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
    createdAt: $('createdAt').value,
    tier: $('tier').value,
    experiment: 'prompt',
    positive: $('positive').value,
    negative: $('negative').value,
    artist: $('pArtist').value.trim(),
    character: $('pCharacter').value.trim(),
    scene: $('pScene').value.trim(),
    model: $('pModel').value.trim(),
  };
}

function slugify(s) {
  return s.toLowerCase().trim()
    .replace(/[^\w\s-]/g, '')
    .replace(/[\s_]+/g, '-')
    .replace(/-+/g, '-').replace(/^-|-$/g, '')
    .slice(0, 80);
}

$('title').addEventListener('change', () => {
  if (!$('slug').value) $('slug').value = slugify($('title').value);
});

/* 从正向提示词提取 @画师，原样保留括号与权重 */
function artistSlug(name) {
  return name.toLowerCase().trim()
    .replace(/[()\\]/g, '')
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/[\s]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function extractArtists() {
  const text = $('positive').value || '';
  // 按顶层逗号切分（忽略括号内、转义括号内）
  const parts = [];
  let depth = 0, buf = '';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '\\' && i + 1 < text.length) { buf += c + text[i + 1]; i++; continue; }
    if (c === '(') depth++;
    else if (c === ')') depth = Math.max(0, depth - 1);
    if (c === ',' && depth === 0) { parts.push(buf.trim()); buf = ''; }
    else buf += c;
  }
  if (buf.trim()) parts.push(buf.trim());

  const tokens = parts.filter(s => s.includes('@'));
  if (!tokens.length) return { raw: '', slugs: [] };

  // 原样排列（带括号和权重），画师字段用
  const raw = tokens.join(', ').replace(/^and\s+/i, '');

  // slug 列表（供 artists 数组用）：逐个 @名字，去权重/括号
  const slugs = [];
  for (const t of tokens) {
    const re = /@([A-Za-z0-9_-]+(?:\s+[A-Za-z0-9_-]+)*)/g;
    let m;
    while ((m = re.exec(t)) !== null) {
      const s = artistSlug(m[1]);
      if (s && !slugs.includes(s)) slugs.push(s);
    }
  }
  return { raw, slugs };
}

/* 从正向提示词提取角色：形如 "hatsune miku \(vocaloid\)" */
function extractCharacter() {
  const text = $('positive').value || '';
  const re = /([a-z][a-z0-9_'-]*(?:\s+[a-z0-9_'-]+){0,4})\s*\\\(([a-z0-9_'-]+(?:\s+[a-z0-9_'-]+)*)\\\)/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const name = m[1].trim();
    // 排除 @画师 与 "1girl/solo" 之类标签
    if (/^(1girl|1boy|girl|boy|solo|adult|woman|man)$/i.test(name)) continue;
    const before = text.slice(Math.max(0, m.index - 3), m.index);
    if (before.includes('@')) continue;
    return name;
  }
  return '';
}

/* 补全：画师串 + 画师 slug + 角色 + 标题骨架 + 标签 */
function autoFill(force) {
  let filled = false;
  // 画师
  const r = extractArtists();
  if (r.raw) {
    if (force || !$('pArtist').value) $('pArtist').value = r.raw;
    if (force || !$('artists').value) $('artists').value = r.slugs.join(', ');
    filled = true;
  }
  // 角色
  const ch = extractCharacter();
  if (ch) {
    if (force || !$('pCharacter').value) $('pCharacter').value = ch;
    // 标题骨架：场景留空时先放角色，用户填场景后再拼
    if (force || !$('title').value) {
      const scene = $('pScene').value.trim();
      $('title').value = scene ? `${scene} · ${ch}` : ch;
    }
    // 标签：补 Anima / 精细 / 角色（场景由用户填后追加）
    if (!force && !$('tags').value) $('tags').value = `Anima, 精细, ${ch}`;
    filled = true;
  }
  return filled;
}

$('extractBtn').addEventListener('click', () => {
  if (autoFill(true)) { refreshPreview(); savePrefs(); showStatus('已补全', true); }
  else showStatus('未找到可补全的画师/角色', false);
});

/* 场景填好后自动拼标题：场景 · 角色（仅当标题仍是角色骨架或空时） */
$('pScene').addEventListener('input', () => {
  const scene = $('pScene').value.trim();
  if (!scene) return;
  const ch = $('pCharacter').value.trim();
  const title = $('title').value.trim();
  if (ch && (!title || title === ch || title.endsWith(' · ' + ch))) {
    $('title').value = `${scene} · ${ch}`;
  }
  // 标签里补场景
  const tags = $('tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if (!tags.includes(scene)) { tags.push(scene); $('tags').value = tags.join(', '); }
});

/* 记住上次：只存配置类字段，不存每张不同的内容 */
const PREFS_KEY = 'ingest-gui-prefs';
const PREF_IDS = ['rating', 'tier', 'pModel', 'negative', 'tags', 'artists', 'pArtist'];
function savePrefs() {
  const p = {};
  for (const id of PREF_IDS) {
    const el = $(id);
    p[id] = el.type === 'radio' ? (document.querySelector('input[name="rating"]:checked') || {}).value : el.value;
  }
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) {}
}
function loadPrefs() {
  let p;
  try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch (e) { return; }
  for (const id of PREF_IDS) {
    if (p[id] === undefined || p[id] === '') continue;
    const el = $(id);
    if (el.type === 'radio') {
      const r = document.querySelector(`input[name="rating"][value="${p[id]}"]`);
      if (r) { r.checked = true; r.dispatchEvent(new Event('change')); }
    } else el.value = p[id];
  }
}

['general','sensitive','nsfw','r18g'].forEach(r => {
  document.querySelector(`input[value="${r}"]`).addEventListener('change', () => {
    ['general','sensitive','nsfw','r18g'].forEach(x => {
      $('lb-' + x).className = x === r ? 'on-' + x : '';
    });
  });
});

function loadImage(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { alert('仅支持 PNG / JPEG / WebP'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    imageData = reader.result;
    $('thumb').src = imageData;
    $('thumb').style.display = 'block';
    $('dropText').style.display = 'none';
  };
  reader.readAsDataURL(file);
}
$('file').addEventListener('change', (e) => loadImage(e.target.files[0]));
$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('drag'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('drag'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault(); $('drop').classList.remove('drag');
  loadImage(e.dataTransfer.files[0]);
});

let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    autoFill(false);   // 仅填充空字段
    refreshPreview();
    savePrefs();
  }, 300);
}
document.querySelectorAll('input,textarea,select').forEach(el => {
  if (el.id !== 'file' && el.id !== 'overwrite') el.addEventListener('input', schedulePreview);
});

async function refreshPreview() {
  try {
    const r = await fetch('/api/preview', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(currentFields())
    });
    const j = await r.json();
    $('preview').textContent = j.markdown || '';
  } catch (e) { $('preview').textContent = '预览失败：' + e.message; }
}
$('previewBtn').addEventListener('click', refreshPreview);

function showStatus(msg, ok) {
  const s = $('status');
  s.textContent = msg;
  s.className = 'status ' + (ok ? 'ok' : 'err');
}

$('submit').addEventListener('click', async () => {
  const btn = $('submit');
  btn.disabled = true;
  showStatus('写入中', true);
  try {
    const r = await fetch('/api/ingest', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ fields: currentFields(), image: imageData, overwrite: $('overwrite').checked })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) {
      if (j.exists) {
        if (confirm(j.error + '\n是否覆盖？')) { $('overwrite').checked = true; btn.click(); return; }
        showStatus('已取消', false);
      } else {
        showStatus('失败：' + (j.error || (j.errors||[]).join('；') || r.status), false);
      }
      return;
    }
    showStatus(`已写入 ${j.md} · ${j.webp}（${j.size}）`, true);
  } catch (e) {
    showStatus('请求失败：' + e.message, false);
  } finally { btn.disabled = false; }
});

$('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('input,textarea,select').forEach(el => {
    if (el.type === 'radio') return;
    if (el.id === 'file') { el.value = ''; return; }
    if (el.id === 'createdAt') { el.value = new Date().toISOString().slice(0,10); return; }
    if (el.id === 'pModel') { el.value = 'Anima Aesthetic v1.1 + Turbo LoRA'; return; }
    if (el.id === 'tier') { el.value = 'refined'; return; }
    el.value = '';
  });
  document.querySelector('input[value="general"]').checked = true;
  ['general','sensitive','nsfw','r18g'].forEach(x => {
    $('lb-' + x).className = x === 'general' ? 'on-general' : '';
  });
  imageData = null;
  $('thumb').style.display = 'none';
  $('dropText').style.display = 'block';
  refreshPreview();
});

/* 历史 */
let histSource = 'comfy';
let histCache = { comfy: [], works: [] };

function histImgUrl(it) {
  if (it.source === 'comfy') {
    const im = it.preview || (it.images || [])[0];
    return im ? `/api/comfy-image?filename=${encodeURIComponent(im.filename)}&subfolder=${encodeURIComponent(im.subfolder||'')}` : '';
  }
  return it.webp || '';
}

function histTitle(it) {
  if (it.source === 'comfy') {
    const m = /(?:^|,)\s*(?:1girl|girl|1boy|boy)[^,]*,\s*([^,]{2,40})/.exec(it.positive || '');
    return (m ? m[1].trim() : (it.positive || '').split(',')[0].trim() || 'ComfyUI').slice(0, 40);
  }
  return it.title || it.slug;
}

function renderHist() {
  const q = ($('histSearch').value || '').toLowerCase().trim();
  let items = histCache[histSource] || [];
  if (q) items = items.filter(it =>
    ((it.positive || '') + ' ' + (it.title || '') + ' ' + (it.slug || '') + ' ' + (it.id || '')).toLowerCase().includes(q));
  const list = $('histList');
  if (!items.length) {
    list.innerHTML = `<div class="hist-empty">${histSource === 'comfy' ? '暂无记录' : '暂无作品'}</div>`;
    $('histHint').textContent = '';
    return;
  }
  list.innerHTML = items.slice(0, 120).map((it, i) => {
    const img = histImgUrl(it);
    const sub = it.source === 'comfy' ? String(it.seed) : it.slug;
    const esc = (s) => String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
    return `<div class="hist-item" data-i="${i}" title="载入">
      ${img ? `<img loading="lazy" src="${img}" onerror="this.style.display='none'" />` : ''}
      <div class="m">${esc(histTitle(it))} · ${esc(sub)}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.hist-item').forEach(el => {
    el.addEventListener('click', () => loadFromHistory(items[Number(el.dataset.i)]));
  });
  $('histHint').textContent = items.length > 120 ? `显示 ${items.length} 条中的前 120 条` : '';
}

function loadFromHistory(it) {
  if (it.source === 'comfy') {
    $('positive').value = it.positive || '';
    $('negative').value = it.negative || '';
    $('pModel').value = 'Anima Aesthetic v1.1 + Turbo LoRA';
    if (it.seed != null) $('slug').value = `comfy-${String(it.seed).slice(-8)}`;
    if (!$('summary').value) $('summary').value = 'Anima Aesthetic v1.1 + Turbo LoRA 精细绘制';
  } else {
    $('title').value = it.title || '';
    $('slug').value = it.slug || '';
    $('positive').value = it.positive || '';
    $('negative').value = it.negative || '';
    $('tags').value = (it.tags || []).join(', ');
    $('artists').value = (it.artists || []).join(', ');
    $('pArtist').value = it.artist || '';
    $('pCharacter').value = it.character || '';
    $('pScene').value = it.scene || '';
    $('pModel').value = it.model || 'Anima Aesthetic v1.1 + Turbo LoRA';
    $('summary').value = `Anima Aesthetic v1.1 + Turbo LoRA 精细绘制：${it.scene || ''}`;
    const r = document.querySelector(`input[name="rating"][value="${it.rating || 'general'}"]`);
    if (r) { r.checked = true; r.dispatchEvent(new Event('change')); }
  }
  const img = histImgUrl(it);
  if (img) {
    fetch(img).then(r => r.blob()).then(blob => {
      const reader = new FileReader();
      reader.onload = () => {
        imageData = reader.result;
        $('thumb').src = imageData;
        $('thumb').style.display = 'block';
        $('dropText').style.display = 'none';
      };
      reader.readAsDataURL(blob);
    }).catch(() => {});
  }
  autoFill(false);   // 历史载入后补全角色/标题骨架（画师可能已填则不覆盖）
  refreshPreview();
  savePrefs();
  showStatus('已载入', true);
  $('histPanel').open = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadHist() {
  $('histList').innerHTML = '<div class="hist-empty">载入中</div>';
  try {
    const url = histSource === 'comfy' ? '/api/history/comfy' : '/api/history/works';
    const r = await fetch(url);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || r.status);
    histCache[histSource] = j.items || [];
    renderHist();
  } catch (e) {
    $('histList').innerHTML = `<div class="hist-empty">载入失败：${e.message}</div>`;
  }
}

$('tabComfy').addEventListener('click', () => {
  histSource = 'comfy';
  $('tabComfy').classList.add('active'); $('tabWorks').classList.remove('active');
  loadHist();
});
$('tabWorks').addEventListener('click', () => {
  histSource = 'works';
  $('tabWorks').classList.add('active'); $('tabComfy').classList.remove('active');
  loadHist();
});
$('histRefresh').addEventListener('click', loadHist);
$('histSearch').addEventListener('input', renderHist);

(async function init() {
  $('createdAt').value = new Date().toISOString().slice(0,10);
  try {
    const r = await fetch('/api/meta');
    const j = await r.json();
    $('negative').value = j.defaultNegative || '';
  } catch (e) {}
  loadPrefs();   // 恢复上次的配置字段
  refreshPreview();
  loadHist();
})();
</script>
</body>
